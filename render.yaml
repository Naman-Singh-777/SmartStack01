# Tells Render how to run the backend. The site itself lives on GitHub Pages.
services:
  - type: web
    name: smartstack01-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      # Optional. Add one in the Render dashboard to switch on live model answers.
      # A free Gemini key from https://aistudio.google.com/apikey is enough.
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
